services:
  localstack:
    image: localstack/localstack:3.5
    ports:
      - "4566:4566"
    environment:
      SERVICES: kinesis,s3,cloudwatch,lambda
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack

  event-producer:
    build:
      context: ./services/event-producer
    depends_on:
      - localstack
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      KINESIS_STREAM_NAME: ecommerce-events-dev
      AUTO_CREATE_STREAM: "true"
      KINESIS_SHARD_COUNT: "2"
      PRODUCER_INTERVAL_SECONDS: "0.25"
      PRODUCER_BATCH_SIZE: "10"
      PRODUCER_MODE: continuous

  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ecommerce-analytics-api

volumes:
  localstack-data:
