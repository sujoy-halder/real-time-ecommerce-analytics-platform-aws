resources:
  jobs:
    ecommerce_streaming_pipeline:
      name: ecommerce-streaming-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_silver_gold_streaming
          notebook_task:
            notebook_path: ../notebooks/streaming_etl.py
            base_parameters:
              bronze_path: s3://ecommerce-analytics-dev-bronze/events
              checkpoint_path: s3://ecommerce-analytics-dev-bronze/checkpoints/ecommerce-streaming
              catalog: ecommerce_analytics
              schema: lakehouse
          job_cluster_key: streaming_cluster
      job_clusters:
        - job_cluster_key: streaming_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            autoscale:
              min_workers: 2
              max_workers: 8

